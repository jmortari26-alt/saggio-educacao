<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F1EF">
<title>Saggio Educação · prévia reservada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230C1D32'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='34' fill='%23F0F1EF'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preload" href="../nome.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Source Serif";src:url(../nome.woff2) format("woff2");font-weight:200 900;font-display:swap}
:root{--papel:#F0F1EF;--folha:#F9F9F7;--marinho:#0C1D32;--latao:#9C7A43;--latao-texto:#7D6033;--aco:#56606E;--fio:#CDD3D8;--fio-2:#DEE2E5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--papel);color:var(--marinho);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.portao{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 16px}
.cartao{position:relative;width:min(440px,100%);text-align:center;background:var(--folha);border:1px solid var(--fio);border-radius:4px;
  padding:42px 30px 26px;box-shadow:0 1px 1px rgba(12,29,50,.05),0 14px 30px -18px rgba(12,29,50,.35),0 40px 60px -44px rgba(12,29,50,.4)}
.cartao::before{content:"";position:absolute;left:30px;right:30px;top:0;height:1px;background:var(--latao);transform-origin:left;animation:traca 1.4s cubic-bezier(.16,.84,.24,1) .2s both}
@keyframes traca{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.marca{display:inline-grid;justify-items:center;gap:6px;margin:0 0 22px;color:var(--marinho);text-decoration:none}
.marca b{font-family:"Source Serif",Georgia,serif;font-weight:420;font-size:30px;line-height:1;letter-spacing:.36em;margin-right:-.36em}
.marca small{font-size:11.5px;letter-spacing:.42em;margin-right:-.42em;color:var(--aco)}
.sub{color:var(--aco);margin:0 0 24px;text-wrap:balance}
.sub strong{display:block;font-family:"Source Serif",Georgia,serif;font-weight:400;font-size:21px;color:var(--marinho);margin-bottom:4px}
.selo{margin:20px 0 0;padding-top:14px;border-top:1px solid var(--fio-2);font-size:12.5px;color:var(--aco)}
@media (max-width:420px){.cartao{padding:36px 20px 22px}.marca b{font-size:27px}}

form{display:grid;gap:12px}
input[type=password]{width:100%;height:52px;border-radius:3px;border:1px solid var(--fio);background:#fff;color:var(--marinho);
  font-size:17px;padding:0 16px;text-align:center;letter-spacing:.04em;transition:border-color .3s,box-shadow .3s}
input[type=password]:focus{outline:none;border-color:var(--latao);box-shadow:0 0 0 3px rgba(156,122,67,.16)}
button{height:52px;border:0;border-radius:3px;background:var(--marinho);color:#F6F6F2;font-weight:600;font-size:16px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 8px 18px -10px rgba(12,29,50,.7);transition:transform .3s cubic-bezier(.16,.84,.24,1),background .3s}
button:hover{background:#16304F;transform:translateY(-1px)}
button:disabled{opacity:.65;cursor:default;transform:none}
.lembrar{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--aco);font-size:14px;min-height:32px}
.lembrar input{accent-color:var(--latao);width:16px;height:16px}
.msg{min-height:22px;margin:0;font-size:14px;color:var(--aco)}
.msg.erro{color:#A33A2E}
.barra{height:2px;background:var(--fio-2);overflow:hidden;opacity:0;transition:opacity .2s}
.barra.ativa{opacity:1}
.barra i{display:block;height:100%;width:0;background:var(--latao);transition:width .25s}
.outra{display:inline-block;margin-top:10px;font-size:13.5px;color:var(--latao-texto);text-decoration:none;padding:6px 0}
.outra:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="portao">
  <div class="cartao">
    <a class="marca" href="../" aria-label="Saggio Educação, prévia"><b>SAGGIO</b><small>EDUCAÇÃO</small></a>
    <p class="sub"><strong>Versão com a bússola</strong>Prévia reservada do novo site.<br>Digite a senha que você recebeu.</p>
    <form id="f" autocomplete="off">
      <input id="senha" type="password" placeholder="Senha" aria-label="Senha" required>
      <button id="b" type="submit">Abrir a prévia</button>
      <label class="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
      <div class="barra" aria-hidden="true"><i id="p"></i></div>
      <p class="msg" id="m" role="status"></p>
    </form>
    <a class="outra" href="../mapa/">Ver a versão com o mapa</a>
    <p class="selo">Prévia reservada · ainda não é o site oficial</p>
  </div>
</main>
<script>
(function () {
  var VOLTAS = 310000, CHAVE = "saggio-previa-senha";
  var f = document.getElementById("f"), campo = document.getElementById("senha"), botao = document.getElementById("b");
  var msg = document.getElementById("m"), barra = document.getElementById("p"), lembrar = document.getElementById("lembrar");
  var conteudo = null;
  // baixa o pacote cifrado enquanto a pessoa digita a senha
  function baixar() {
    if (conteudo) { return conteudo; }
    barra.parentNode.classList.add("ativa");
    conteudo = fetch("pacote.bin").then(function (r) {
      if (!r.ok) { throw new Error("pacote " + r.status); }
      if (!r.body) { return r.arrayBuffer(); }
      var total = +r.headers.get("content-length") || 0, lido = 0, partes = [], leitor = r.body.getReader();
      function passo() {
        return leitor.read().then(function (x) {
          if (x.done) { return new Blob(partes).arrayBuffer(); }
          partes.push(x.value); lido += x.value.length;
          if (total) { barra.style.width = Math.min(100, lido / total * 100).toFixed(0) + "%"; }
          return passo();
        });
      }
      return passo();
    });
    conteudo.catch(function () { conteudo = null; });
    return conteudo;
  }
  // troca cada caminho citado (assets/, fontes/, img/, video/, com ou sem ../ na frente) pelo endereço blob: do arquivo
  var CITA = /(^|[^\w\/.-])(?:\.\.\/)?((?:assets|fontes|img|video)\/[\w.\/-]+?\.(?:css|js|woff2|webp|png|jpg|mp4))/g;
  function trocar(texto, mapa) {
    return texto.replace(CITA, function (tudo, antes, caminho) { return mapa[caminho] ? antes + mapa[caminho] : tudo; });
  }
  function montar(claro) {
    var visao = new DataView(claro), tam = visao.getUint32(0), dec = new TextDecoder();
    var indice = JSON.parse(dec.decode(new Uint8Array(claro, 4, tam))), base = 4 + tam, mapa = {}, textos = [], pagina = "";
    indice.forEach(function (a) {
      var bytes = new Uint8Array(claro, base + a.o, a.n);
      if (a.p === "pagina.html") { pagina = dec.decode(bytes); }
      else if (/\.(css|js)$/.test(a.p)) { textos.push([a, dec.decode(bytes)]); }
      else { mapa[a.p] = URL.createObjectURL(new Blob([bytes], { type: a.t })); }
    });
    // folhas de estilo e scripts depois das fotos, fontes e vídeos: eles citam esses arquivos
    textos.forEach(function (x) { mapa[x[0].p] = URL.createObjectURL(new Blob([trocar(x[1], mapa)], { type: x[0].t })); });
    return trocar(pagina, mapa);
  }
  function abrir(senha) {
    botao.disabled = true; msg.className = "msg"; msg.textContent = "Abrindo a prévia…";
    var baixado;
    return baixar().then(function (buf) {
      baixado = true;
      var b = new Uint8Array(buf), sal = b.slice(0, 16), iv = b.slice(16, 28), dados = b.slice(28);
      return crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]).then(function (k) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: VOLTAS, hash: "SHA-256" }, k,
          { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      }).then(function (chave) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, dados); });
    }).then(function (claro) {
      try { if (lembrar.checked) { localStorage.setItem(CHAVE, senha); } } catch (e) { /* navegador sem armazenamento */ }
      var html = montar(claro);
      document.open(); document.write(html); document.close();
    }).catch(function () {
      botao.disabled = false; msg.className = "msg erro";
      if (!baixado) { msg.textContent = "Não foi possível baixar a prévia. Confira a internet e tente de novo."; return; }
      try { localStorage.removeItem(CHAVE); } catch (e) { /* sem armazenamento */ }
      msg.textContent = "Senha não confere. Tente de novo.";
      campo.select();
    });
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); if (campo.value) { abrir(campo.value.trim()); } });
  campo.addEventListener("input", baixar, { once: true });
  var guardada = null;
  try { guardada = localStorage.getItem(CHAVE); } catch (e) { /* sem armazenamento */ }
  if (guardada) { abrir(guardada); } else { campo.focus(); }
})();
</script>
</body>
</html>
