<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F1EF">
<title>Saggio Educação · prévia reservada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230C1D32'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='34' fill='%23F0F1EF'%3ES%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:"Source Serif";src:url(nome.woff2) format("woff2");font-weight:200 900;font-display:swap}
:root{--papel:#F0F1EF;--folha:#F9F9F7;--marinho:#0C1D32;--latao:#9C7A43;--latao-texto:#7D6033;--aco:#56606E;--fio:#CDD3D8;--fio-2:#DEE2E5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--papel);color:var(--marinho);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.portao{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 16px}
.cartao{position:relative;width:min(440px,100%);text-align:center;background:var(--folha);border:1px solid var(--fio);border-radius:4px;
  padding:42px 30px 26px;box-shadow:0 1px 1px rgba(12,29,50,.05),0 14px 30px -18px rgba(12,29,50,.35),0 40px 60px -44px rgba(12,29,50,.4)}
.cartao::before{content:"";position:absolute;left:30px;right:30px;top:0;height:1px;background:var(--latao);transform-origin:left;animation:traca 1.4s cubic-bezier(.16,.84,.24,1) .2s both}
@keyframes traca{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.marca{display:inline-grid;justify-items:center;gap:6px;margin:0 0 22px;color:var(--marinho);text-decoration:none}
.marca b{font-family:"Source Serif",Georgia,serif;font-weight:420;font-size:30px;line-height:1;letter-spacing:.36em;margin-right:-.36em}
.marca small{font-size:11.5px;letter-spacing:.42em;margin-right:-.42em;color:var(--aco)}
.sub{color:var(--aco);margin:0 0 24px;text-wrap:balance}
.sub strong{display:block;font-family:"Source Serif",Georgia,serif;font-weight:400;font-size:21px;color:var(--marinho);margin-bottom:4px}
.selo{margin:20px 0 0;padding-top:14px;border-top:1px solid var(--fio-2);font-size:12.5px;color:var(--aco)}
@media (max-width:420px){.cartao{padding:36px 20px 22px}.marca b{font-size:27px}}

.versoes{display:grid;gap:12px}
.versoes a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 18px;border:1px solid var(--fio);border-radius:3px;
  background:#fff;color:var(--marinho);text-decoration:none;font-weight:600;transition:border-color .3s,transform .4s cubic-bezier(.16,.84,.24,1),box-shadow .4s}
.versoes a:first-child{background:var(--marinho);border-color:var(--marinho);color:#F6F6F2}
.versoes a:hover{border-color:var(--latao);transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(12,29,50,.6)}
.versoes svg{width:16px;height:16px;flex:none;transition:transform .4s cubic-bezier(.16,.84,.24,1)}
.versoes a:hover svg{transform:translateX(4px)}
</style>
</head>
<body>
<main class="portao">
  <div class="cartao">
    <p class="marca"><b>SAGGIO</b><small>EDUCAÇÃO</small></p>
    <p class="sub"><strong>Prévia reservada</strong>Duas versões do novo site. A senha é a mesma nas duas.</p>
    <nav class="versoes" aria-label="Versões da prévia">
      <a href="bussola/">Versão com a bússola<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <a href="mapa/">Versão com o mapa<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </nav>
    <p class="selo">Prévia reservada · ainda não é o site oficial</p>
  </div>
</main>
</body>
</html>
